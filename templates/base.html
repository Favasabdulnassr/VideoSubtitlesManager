<!-- base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SubtitleVault — Video Subtitle Manager{% endblock %}</title>
    <meta name="description" content="Upload, manage and search through video subtitles with ease.">
    {% load static %}
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Video.js -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet">
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #0a0d14;
            --bg2:       #111520;
            --surface:   rgba(255,255,255,0.05);
            --surface2:  rgba(255,255,255,0.08);
            --border:    rgba(255,255,255,0.10);
            --accent:    #6c63ff;
            --accent2:   #a78bfa;
            --danger:    #ef4444;
            --danger-h:  #dc2626;
            --success:   #22c55e;
            --text:      #e8eaf6;
            --text-muted:#94a3b8;
            --radius:    14px;
            --radius-sm: 8px;
            --shadow:    0 8px 32px rgba(0,0,0,0.4);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse 80% 60% at 20% -10%, rgba(108,99,255,0.18) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 80% 100%, rgba(167,139,250,0.12) 0%, transparent 70%);
        }

        /* ── NAV ── */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10,13,20,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .nav-brand span {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-logo-icon {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .nav-links { display: flex; align-items: center; gap: 8px; }
        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }
        .nav-link:hover { color: var(--text); background: var(--surface); }
        .nav-link.active, .nav-link-primary {
            color: white;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            padding: 8px 20px;
        }
        .nav-link-primary:hover { opacity: 0.88; transform: translateY(-1px); }

        /* ── MAIN ── */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        /* ── BUTTONS ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
        }
        .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(108,99,255,0.4); }
        .btn-ghost {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { background: var(--surface2); transform: translateY(-1px); }
        .btn-danger {
            background: rgba(239,68,68,0.12);
            color: var(--danger);
            border: 1px solid rgba(239,68,68,0.25);
        }
        .btn-danger:hover { background: var(--danger); color: white; transform: translateY(-1px); }

        /* ── CARDS ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px;
            transition: all 0.25s;
        }
        .card:hover { background: var(--surface2); border-color: rgba(255,255,255,0.15); transform: translateY(-2px); box-shadow: var(--shadow); }

        /* ── PAGE HEADER ── */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 40px;
        }
        .page-header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--text) 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── BADGE ── */
        .badge {
            display: inline-flex; align-items: center;
            padding: 3px 10px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .badge-accent { background: rgba(108,99,255,0.2); color: var(--accent2); border: 1px solid rgba(108,99,255,0.3); }
        .badge-muted  { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }

        /* ── VIDEOJS OVERRIDES ── */
        .vjs-subs-caps-button { display: none !important; }
        .video-js .vjs-big-play-button {
            background: linear-gradient(135deg, var(--accent), var(--accent2)) !important;
            border: none !important;
            border-radius: 50% !important;
            width: 70px !important; height: 70px !important;
            top: 50% !important; left: 50% !important;
            transform: translate(-50%, -50%) !important;
        }
        .vjs-default-skin { border-radius: var(--radius) !important; overflow: hidden !important; }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'video_list' %}" class="nav-brand">
                <div class="nav-logo-icon">▶</div>
                Subtitle<span>Vault</span>
            </a>
            <div class="nav-links">
                <a href="{% url 'video_list' %}" class="nav-link">Library</a>
                <a href="{% url 'video_upload' %}" class="nav-link nav-link-primary">+ Upload Video</a>
            </div>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
